[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advantage-ai-scraper"
version = "0.1.0"
description = "Async HTTP scraping dependencies for Advantage AI Solutions"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5",
    "pydantic>=2",
    "tenacity>=8",
]

[tool.setuptools]
packages = []
